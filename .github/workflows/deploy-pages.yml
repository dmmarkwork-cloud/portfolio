name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage published site
        run: |
          mkdir -p dist
          rsync -a project/ dist/ \
            --exclude 'figures/about/_unused/' \
            --exclude 'uploads/' \
            --exclude '*.dc.html' \
            --exclude 'cad/' \
            --exclude 'cfd/' \
            --exclude 'docs/' \
            --exclude 'drawings/' \
            --exclude 'screenshots/' \
            --exclude 'deck-stage.js' \
            --exclude 'support.js' \
            --exclude 'github.md' \
            --exclude '.thumbnail'
          mkdir -p dist/uploads
          cp "project/uploads/Mark-Yamanaka-Resume.pdf" dist/uploads/

      # Pages has no server-side redirects, so this stub is the only lever at
      # the /portfolio/ entry point. It is generated into dist/ and never
      # committed, which is what makes it safe to send traffic off-site:
      # portfolio-light.html itself is shared with Vercel, and a redirect
      # inside that file would make the custom domain redirect to itself.
      - name: Generate Pages redirect stub
        run: |
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>Redirecting…</title>
          <meta http-equiv="refresh" content="0; url=https://www.mlyamanaka.com/">
          <link rel="canonical" href="https://www.mlyamanaka.com/">
          <p>Redirecting to <a href="https://www.mlyamanaka.com/">www.mlyamanaka.com</a>…</p>
          <p><a href="./portfolio-light.html">Open this mirror instead</a> if that address is unavailable.</p>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
