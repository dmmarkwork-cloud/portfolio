name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage published site
        run: |
          mkdir -p dist
          rsync -a project/ dist/ \
            --exclude 'figures/about/_unused/' \
            --exclude 'uploads/' \
            --exclude '*.dc.html' \
            --exclude 'cad/' \
            --exclude 'cfd/' \
            --exclude 'docs/' \
            --exclude 'drawings/' \
            --exclude 'screenshots/' \
            --exclude 'deck-stage.js' \
            --exclude 'support.js' \
            --exclude 'github.md' \
            --exclude '.thumbnail'
          mkdir -p dist/uploads
          cp "project/uploads/Mark-Yamanaka-Resume.pdf" dist/uploads/
          printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>Redirecting…</title>\n<meta http-equiv="refresh" content="0; url=./portfolio-light.html">\n<link rel="canonical" href="./portfolio-light.html">\n' > dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
